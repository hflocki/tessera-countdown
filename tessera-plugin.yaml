# Days until a day that matters, with a picture of its season: Christmas, New Year's Eve, Easter and more, a date of
# your own, or the next event of a calendar or the date of an entity. Every field is explained in docs/MANIFEST.md of
# tessera-plugins.
id: countdown
version: 1.1.0
# 0.10: pictures on a tile; 0.15: a tile's option of kind entity; 0.27: the instrument's roles for the veil.
api: "0.27"
icon: calendar
maintainer: hflocki
license: MIT
stage: beta
topics: [time, fun]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 12
attributes: [cloud]
# The pictures come from this repository on GitHub, fetched by the app (README, "Privacy").
privacy: https://github.com/hflocki/tessera-countdown#privacy

permissions:
  # The seasonal pictures in motifs/ of this repository.
  network: [raw.githubusercontent.com]

tiles:
  - id: countdown
    name: tile_name
    icon: calendar
    sizes: { min: 1x1, max: 4x3 }
    # A picture, a veil, a number and two labels.
    memory: 700
    pictures: 1
    example: tile_example
    options:
      - { id: auto, kind: toggle, default: true, label: auto, hint: auto_hint }
      - id: event
        kind: choice
        default: christmas
        label: event
        hint: event_hint
        choices:
          - { value: christmas, label: event_christmas }
          - { value: new_years_eve, label: event_new_years_eve }
          - { value: easter, label: event_easter }
          - { value: advent, label: event_advent }
          - { value: halloween, label: event_halloween }
          - { value: summer, label: event_summer }
          - { value: date, label: event_date }
          - { value: entity, label: event_entity }
      - { id: date, kind: text, label: date, hint: date_hint }
      - { id: entity, kind: entity, domains: [calendar, input_datetime, sensor], attributes: [message, start_time],
          label: entity, hint: entity_hint }
      - { id: what, kind: text, label: what, hint: what_hint }
      - id: layout
        kind: choice
        default: background
        label: layout
        hint: layout_hint
        choices:
          - { value: background, label: layout_background }
          - { value: side, label: layout_side }
          - { value: banner, label: layout_banner }
      - id: motif
        kind: choice
        default: auto
        label: motif
        hint: motif_hint
        choices:
          - { value: auto, label: motif_auto }
          - { value: christmas, label: motif_christmas }
          - { value: advent, label: motif_advent }
          - { value: new_year, label: motif_new_year }
          - { value: easter, label: motif_easter }
          - { value: spring, label: motif_spring }
          - { value: summer, label: motif_summer }
          - { value: autumn, label: motif_autumn }
          - { value: halloween, label: motif_halloween }
          - { value: winter, label: motif_winter }
          - { value: birthday, label: motif_birthday }
          - { value: travel, label: motif_travel }
          - { value: none, label: motif_none }
